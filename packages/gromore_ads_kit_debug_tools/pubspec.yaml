name: gromore_ads_kit_debug_tools
description: GroMore 官方广告测试工具的 Flutter 调试扩展，请勿随线上版本发布。
version: 1.0.0
homepage: https://github.com/zhangruiyu/gromore_ads_kit
repository: https://github.com/zhangruiyu/gromore_ads_kit/tree/main/packages/gromore_ads_kit_debug_tools
issue_tracker: https://github.com/zhangruiyu/gromore_ads_kit/issues

topics:
  - ads
  - gromore
  - debugging
  - mediation

environment:
  sdk: ^3.11.4
  flutter: '>=3.41.6'

dependencies:
  flutter:
    sdk: flutter
  gromore_ads_kit: ^2.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zhecent.gromore_ads_kit_debug_tools
        pluginClass: GromoreAdsKitDebugToolsPlugin
      ios:
        pluginClass: GromoreAdsKitDebugToolsPlugin
