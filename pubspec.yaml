name: gromore_ads_kit
description: >-
  GroMore 广告聚合 Flutter 核心插件，支持 Android、iOS 和 HarmonyOS 的开屏、
  插屏、Banner、激励视频、信息流和 Draw 信息流广告，第三方 ADN 可按需接入。
version: 2.0.2
homepage: https://github.com/zhangruiyu/gromore_ads_kit
repository: https://github.com/zhangruiyu/gromore_ads_kit
issue_tracker: https://github.com/zhangruiyu/gromore_ads_kit/issues

topics:
  - ads
  - gromore
  - mediation
  - pangle
  - flutter-plugin

environment:
  sdk: ^3.11.4
  flutter: '>=3.41.6'

dependencies:
  flutter:
    sdk: flutter
  flutter_platform_utils: ^1.0.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zhecent.gromore_ads_kit
        pluginClass: GromoreAdsKitPlugin
      ios:
        pluginClass: GromoreAdsKitPlugin
      ohos:
        pluginClass: GromoreAdsKitPlugin
