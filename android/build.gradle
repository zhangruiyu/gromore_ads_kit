group = "com.zhecent.gromore_ads_kit"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// GroMore 核心、测试工具和 Adapter 直接从字节跳动官方 Maven 下载。
// 百度、Sigmob、快手的指定原生 SDK 仍使用插件随附版本，避免与 Adapter 版本不匹配。
def pangleRepository = uri("https://artifact.bytedance.com/repository/pangle")
def bundledAdnRepository = uri("$projectDir/maven")
rootProject.allprojects {
    repositories {
        maven {
            url pangleRepository
        }
        maven {
            url bundledAdnRepository
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.zhecent.gromore_ads_kit"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.7.1'
        implementation 'com.squareup.okhttp3:okhttp:3.12.1'
        implementation "com.pangle.cn:mediation-sdk:7.7.1.6"

        // GroMore 官方测试工具通过字节跳动 Maven 引入，宿主无需再单独声明依赖。
        implementation 'com.pangle.cn:mediation-test-tools:7.7.1.6'
        // 测试工具的 BottomDialog 使用 statusBarBackground，插件独立校验资源时也需要它。
        implementation 'androidx.coordinatorlayout:coordinatorlayout:1.0.0'

        // 优量汇 SDK 和 Adapter 必须成对进入 APK。
        implementation 'com.qq.e.union:union:4.680.1550'
        implementation 'com.pangle.cn:mediation-gdt-adapter:4.680.1550.1'

        // 百度 SDK 和 Adapter 必须成对进入 APK；使用 GroMore 7.7.1.6 官方包里的 9.4503。
        implementation 'com.baidu.local:mobads:9.4503'
        implementation 'com.pangle.cn:mediation-baidu-adapter:9.4503.1'

        // Sigmob SDK、公共库和 Adapter 必须使用相互匹配的版本。
        implementation 'com.sigmob.local:windad:4.25.14'
        implementation 'com.sigmob.local:windad-common:2.0.1'
        implementation 'com.pangle.cn:mediation-sigmob-adapter:4.25.14.1'

        // 快手 SDK 和 Adapter 必须成对进入 APK；版本来自 GroMore 7.7.1.6 官方生成包。
        implementation 'com.kuaishou.local:kssdk-ad:5.3.20.1'
        implementation 'com.pangle.cn:mediation-ks-adapter:5.3.20.1.1'

        // 用于加载 GroMore 测试工具里的图片。
        implementation 'com.github.bumptech.glide:glide:4.16.0'

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
