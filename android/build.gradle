group = "com.zhecent.gromore_ads_kit"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// 核心包只接入 GroMore。第三方 ADN 和官方测试工具由独立扩展包按需提供。
def pangleRepository = uri("https://artifact.bytedance.com/repository/pangle")
rootProject.allprojects {
    repositories {
        maven {
            url pangleRepository
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.zhecent.gromore_ads_kit"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.7.1'
        implementation 'com.squareup.okhttp3:okhttp:3.12.1'
        implementation "com.pangle.cn:mediation-sdk:7.7.1.6"

        // 信息流原生渲染需要加载广告图片。
        implementation 'com.github.bumptech.glide:glide:4.16.0'

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
